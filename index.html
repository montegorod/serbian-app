<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Srpski — фразы</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mut:#667085;--pr:#1d4ed8;--ok:#16a34a;--bad:#dc2626;--bd:#e0e5ef}
@media(prefers-color-scheme:dark){:root{--bg:#10131a;--card:#1a1f2b;--tx:#eef1f7;--mut:#9aa4b8;--pr:#5b8cff;--bd:#2a3142}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.4 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:8px 0 16px}h2{font-size:19px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin:12px 0}
button{font:inherit;border:0;border-radius:12px;padding:13px 16px;background:var(--pr);color:#fff;cursor:pointer;width:100%;margin:6px 0}
button.sec{background:transparent;color:var(--pr);border:1px solid var(--bd)}
button.opt{background:var(--card);color:var(--tx);border:2px solid var(--bd);text-align:left}
button.small{width:auto;padding:8px 12px;margin:0}
button.good{background:var(--ok)}button.bad{background:var(--bad)}
input,textarea{font:inherit;width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);margin:6px 0}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>.small{flex:none}
.stats{display:flex;gap:8px}.stats div{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;text-align:center}
.stats b{display:block;font-size:24px}.mut{color:var(--mut);font-size:14px}
.big{font-size:24px;font-weight:600;margin:8px 0}.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.fb{padding:12px;border-radius:12px;margin:10px 0}.fb.ok{background:#16a34a22;color:var(--ok)}.fb.no{background:#dc262622;color:var(--bad)}
.item{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}.item div{flex:1}
</style></head><body><main id="app"></main><script src="app.js"></script></body></html>
